<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#f8dce8"
    >

    <title>RUSSIEN @18 — Guest Access</title>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Great+Vibes&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --pink-light: #fbe8ef;
            --pink: #e9a9bd;
            --pink-dark: #a85d78;

            --purple-light: #eee5f3;
            --purple: #b59ac5;
            --purple-dark: #76566f;

            --pearl: #fffdfb;
            --cream: #fff8f8;
            --text: #553f4c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            background:
                radial-gradient(
                    circle at top left,
                    var(--purple-light),
                    transparent 40%
                ),
                radial-gradient(
                    circle at bottom right,
                    var(--pink-light),
                    transparent 45%
                ),
                var(--cream);

            color: var(--text);

            font-family: "DM Sans", sans-serif;
        }

        .container {

            width: 100%;
            max-width: 440px;

            background: rgba(255, 253, 251, 0.88);

            border: 1px solid rgba(181, 154, 197, 0.25);

            border-radius: 28px;

            padding: 45px 32px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(118, 86, 111, 0.14);

            backdrop-filter: blur(12px);
        }

        .small-title {

            font-family: "DM Sans", sans-serif;

            font-size: 12px;

            letter-spacing: 4px;

            color: var(--purple-dark);

            margin-bottom: 10px;
        }

        .title {

            font-family: "Great Vibes", cursive;

            font-size: 48px;

            color: var(--pink-dark);

            line-height: 1;

            margin-bottom: 10px;
        }

        .subtitle {

            font-family: "Cormorant Garamond", serif;

            font-size: 22px;

            color: var(--text);

            margin-bottom: 28px;
        }

        .tabs {

            display: flex;

            gap: 8px;

            padding: 5px;

            background: var(--purple-light);

            border-radius: 14px;

            margin-bottom: 25px;
        }

        .tab {

            flex: 1;

            border: none;

            background: transparent;

            padding: 11px 8px;

            border-radius: 10px;

            color: var(--purple-dark);

            font-family: "DM Sans", sans-serif;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.25s ease;
        }

        .tab.active {

            background: var(--pearl);

            color: var(--pink-dark);

            box-shadow:
                0 3px 10px rgba(118, 86, 111, 0.10);
        }

        .form {

            display: none;

            text-align: left;
        }

        .form.active {
            display: block;
        }

        label {

            display: block;

            margin-bottom: 8px;

            font-size: 13px;

            font-weight: 500;

            color: var(--text);
        }

        input {

            width: 100%;

            padding: 14px 15px;

            margin-bottom: 17px;

            border: 1px solid rgba(168, 93, 120, 0.25);

            border-radius: 13px;

            outline: none;

            background: rgba(255, 253, 251, 0.9);

            color: var(--text);

            font-family: "DM Sans", sans-serif;

            font-size: 14px;

            transition: 0.25s ease;
        }

        input:focus {

            border-color: var(--pink);

            box-shadow:
                0 0 0 3px rgba(233, 169, 189, 0.16);
        }

        input::placeholder {
            color: #a8959e;
        }

        .main-button {

            width: 100%;

            border: none;

            border-radius: 14px;

            padding: 14px;

            background:
                linear-gradient(
                    135deg,
                    var(--pink),
                    var(--purple)
                );

            color: white;

            font-family: "DM Sans", sans-serif;

            font-size: 14px;

            font-weight: 600;

            letter-spacing: 0.5px;

            cursor: pointer;

            transition: 0.25s ease;

            box-shadow:
                0 8px 20px rgba(168, 93, 120, 0.18);
        }

        .main-button:hover {

            transform: translateY(-1px);

            box-shadow:
                0 11px 24px rgba(168, 93, 120, 0.22);
        }

        .main-button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }

        .message {

            min-height: 22px;

            margin-top: 15px;

            text-align: center;

            font-size: 13px;

            line-height: 1.5;
        }

        .message.error {
            color: #a34f68;
        }

        .message.success {
            color: #687c68;
        }

        .hint {

            margin-top: 22px;

            text-align: center;

            font-size: 12px;

            color: #8c7982;

            line-height: 1.5;
        }

        @media (max-width: 480px) {

            body {
                padding: 16px;
            }

            .container {
                padding: 35px 22px;
                border-radius: 24px;
            }

            .title {
                font-size: 43px;
            }

            .subtitle {
                font-size: 20px;
            }
        }

    </style>

</head>

<body>

    <main class="container">

        <p class="small-title">
            WELCOME TO
        </p>

        <h1 class="title">
            Russien @18
        </h1>

        <p class="subtitle">
            Share your memories
        </p>


        <!-- TABS -->

        <div class="tabs">

            <button
                type="button"
                class="tab active"
                id="signUpTab"
            >
                Sign Up
            </button>

            <button
                type="button"
                class="tab"
                id="loginTab"
            >
                Log In
            </button>

        </div>


        <!-- SIGN UP -->

        <form
            class="form active"
            id="signUpForm"
        >

            <label for="signUpNickname">
                Nickname
            </label>

            <input
                type="text"
                id="signUpNickname"
                placeholder="Enter your nickname"
                maxlength="30"
                autocomplete="username"
                required
            >


            <label for="signUpPassword">
                Password
            </label>

            <input
                type="password"
                id="signUpPassword"
                placeholder="Create a password"
                minlength="6"
                autocomplete="new-password"
                required
            >


            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Enter your password again"
                minlength="6"
                autocomplete="new-password"
                required
            >


            <button
                type="submit"
                class="main-button"
                id="signUpButton"
            >
                CREATE ACCOUNT
            </button>

        </form>


        <!-- LOG IN -->

        <form
            class="form"
            id="loginForm"
        >

            <label for="loginNickname">
                Nickname
            </label>

            <input
                type="text"
                id="loginNickname"
                placeholder="Enter your nickname"
                maxlength="30"
                autocomplete="username"
                required
            >


            <label for="loginPassword">
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                class="main-button"
                id="loginButton"
            >
                LOG IN
            </button>

        </form>


        <div
            class="message"
            id="message"
        ></div>


        <p class="hint">
            Use the same nickname and password whenever
            you want to access your photos again.
        </p>

    </main>


    <script>

        const SUPABASE_URL =
            "https://magaomtlctseieufgijk.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_nIm23K5lShcFGJ6m18DzaA_EAXQXGc0";


        const signUpTab =
            document.getElementById("signUpTab");

        const loginTab =
            document.getElementById("loginTab");

        const signUpForm =
            document.getElementById("signUpForm");

        const loginForm =
            document.getElementById("loginForm");

        const message =
            document.getElementById("message");


        function showMessage(text, type = "") {

            message.textContent = text;

            message.className =
                `message ${type}`;

        }


        function createEmail(nickname) {

            return nickname
                .trim()
                .toLowerCase()
                .replace(/[^a-z0-9]/g, "")
                + "@russien18.gallery";

        }


        function switchToSignUp() {

            signUpTab.classList.add("active");

            loginTab.classList.remove("active");

            signUpForm.classList.add("active");

            loginForm.classList.remove("active");

            showMessage("");

        }


        function switchToLogin() {

            loginTab.classList.add("active");

            signUpTab.classList.remove("active");

            loginForm.classList.add("active");

            signUpForm.classList.remove("active");

            showMessage("");

        }


        signUpTab.addEventListener(
            "click",
            switchToSignUp
        );


        loginTab.addEventListener(
            "click",
            switchToLogin
        );


        /*
        ================================
        SIGN UP
        ================================
        */

        signUpForm.addEventListener(
            "submit",
            async event => {

                event.preventDefault();


                const nickname =
                    document
                        .getElementById("signUpNickname")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("signUpPassword")
                        .value;


                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;


                if (nickname.length < 2) {

                    showMessage(
                        "Please enter a nickname.",
                        "error"
                    );

                    return;
                }


                if (password.length < 6) {

                    showMessage(
                        "Password must be at least 6 characters.",
                        "error"
                    );

                    return;
                }


                if (password !== confirmPassword) {

                    showMessage(
                        "Passwords do not match.",
                        "error"
                    );

                    return;
                }


                const signUpButton =
                    document.getElementById("signUpButton");


                signUpButton.disabled = true;

                signUpButton.textContent =
                    "CREATING ACCOUNT...";


                showMessage("");


                try {

                    const email =
                        createEmail(nickname);


                    const response =
                        await fetch(
                            `${SUPABASE_URL}/auth/v1/signup`,
                            {
                                method: "POST",

                                headers: {
                                    "apikey":
                                        SUPABASE_KEY,

                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    email: email,
                                    password: password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            data.msg ||
                            data.error_description ||
                            "Unable to create account."
                        );

                    }


                    /*
                    If Supabase immediately gives us
                    a session, use it.
                    */

                    if (data.access_token) {

                        sessionStorage.setItem(
                            "russienNickname",
                            nickname
                        );

                        sessionStorage.setItem(
                            "russienAccessToken",
                            data.access_token
                        );

                        sessionStorage.setItem(
                            "russienRefreshToken",
                            data.refresh_token || ""
                        );


                        showMessage(
                            "Account created successfully!",
                            "success"
                        );


                        setTimeout(() => {

                            window.location.href =
                                "upload.html";

                        }, 800);


                        return;
                    }


                    /*
                    If there is no session,
                    try logging in automatically.
                    */

                    const loginResponse =
                        await fetch(
                            `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
                            {
                                method: "POST",

                                headers: {
                                    "apikey":
                                        SUPABASE_KEY,

                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    email: email,
                                    password: password
                                })
                            }
                        );


                    const loginData =
                        await loginResponse.json();


                    if (!loginResponse.ok) {

                        throw new Error(
                            loginData.error_description ||
                            loginData.message ||
                            "Account created, but automatic login failed."
                        );

                    }


                    sessionStorage.setItem(
                        "russienNickname",
                        nickname
                    );

                    sessionStorage.setItem(
                        "russienAccessToken",
                        loginData.access_token
                    );

                    sessionStorage.setItem(
                        "russienRefreshToken",
                        loginData.refresh_token || ""
                    );


                    showMessage(
                        "Account created successfully!",
                        "success"
                    );


                    setTimeout(() => {

                        window.location.href =
                            "upload.html";

                    }, 800);


                } catch (error) {

                    console.error(
                        "SIGN UP ERROR:",
                        error
                    );


                    showMessage(
                        error.message,
                        "error"
                    );


                    signUpButton.disabled =
                        false;

                    signUpButton.textContent =
                        "CREATE ACCOUNT";

                }

            }
        );


        /*
        ================================
        LOG IN
        ================================
        */

        loginForm.addEventListener(
            "submit",
            async event => {

                event.preventDefault();


                const nickname =
                    document
                        .getElementById("loginNickname")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("loginPassword")
                        .value;


                if (!nickname || !password) {

                    showMessage(
                        "Please enter your nickname and password.",
                        "error"
                    );

                    return;
                }


                const loginButton =
                    document.getElementById("loginButton");


                loginButton.disabled = true;

                loginButton.textContent =
                    "LOGGING IN...";


                showMessage("");


                try {

                    const email =
                        createEmail(nickname);


                    const response =
                        await fetch(
                            `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
                            {
                                method: "POST",

                                headers: {
                                    "apikey":
                                        SUPABASE_KEY,

                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    email: email,
                                    password: password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.error_description ||
                            data.message ||
                            "Incorrect nickname or password."
                        );

                    }


                    sessionStorage.setItem(
                        "russienNickname",
                        nickname
                    );

                    sessionStorage.setItem(
                        "russienAccessToken",
                        data.access_token
                    );

                    sessionStorage.setItem(
                        "russienRefreshToken",
                        data.refresh_token || ""
                    );


                    showMessage(
                        "Login successful!",
                        "success"
                    );


                    setTimeout(() => {

                        window.location.href =
                            "upload.html";

                    }, 700);


                } catch (error) {

                    console.error(
                        "LOGIN ERROR:",
                        error
                    );


                    showMessage(
                        error.message,
                        "error"
                    );


                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "LOG IN";

                }

            }
        );

    </script>

</body>

</html>
