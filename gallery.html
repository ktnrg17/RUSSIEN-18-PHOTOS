<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#fbe8ef"
    >

    <title>Russien @18 | Gallery</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500&family=Great+Vibes&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --pink-light: #fbe8ef;
            --pink: #e9a9bd;
            --pink-dark: #a85d78;

            --purple-light: #eee5f3;
            --purple: #b59ac5;
            --purple-dark: #76566f;

            --pearl: #fffdfb;
            --cream: #fff8f8;
            --text: #553f4c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            font-family: "DM Sans", sans-serif;

            color: var(--text);

            background:
                linear-gradient(
                    135deg,
                    var(--pink-light),
                    var(--purple-light),
                    var(--cream)
                );

            padding: 30px 18px;
        }

        .gallery-page {
            width: 100%;

            max-width: 1200px;

            margin: auto;
        }

        .gallery-card {
            background:
                rgba(255, 253, 251, 0.94);

            border-radius: 32px;

            padding: 55px 30px;

            box-shadow:
                0 20px 60px
                rgba(118, 86, 111, 0.15);
        }

        .script-title {
            margin: 0;

            text-align: center;

            font-family:
                "Great Vibes",
                cursive;

            font-size: 52px;

            color:
                var(--pink-dark);
        }

        h1 {
            margin: 12px 0 10px;

            text-align: center;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                clamp(42px, 7vw, 70px);

            font-weight: 500;

            color:
                var(--purple-dark);
        }

        .description {
            max-width: 650px;

            margin:
                0 auto 45px;

            text-align: center;

            font-size: 17px;

            line-height: 1.7;

            color:
                var(--text);
        }

        .gallery-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;
        }

        .gallery-item {
            position: relative;

            overflow: hidden;

            border-radius: 20px;

            background:
                var(--purple-light);

            box-shadow:
                0 8px 25px
                rgba(118, 86, 111, 0.12);
        }

        .gallery-item img {
            display: block;

            width: 100%;

            aspect-ratio: 1 / 1;

            object-fit: cover;

            transition:
                transform 0.4s ease;
        }

        .gallery-item:hover img {
            transform:
                scale(1.04);
        }

        .photo-info {
            position: absolute;

            left: 10px;

            bottom: 10px;

            display: flex;

            align-items: center;

            gap: 7px;

            padding: 4px 8px;

            background:
                rgba(
                    255,
                    253,
                    251,
                    0.82
                );

            border-radius: 8px;

            backdrop-filter:
                blur(5px);
        }

        .nickname {
            margin: 0;

            font-family:
                "DM Sans",
                sans-serif;

            font-size: 12px;

            font-weight: 500;

            color:
                var(--text);
        }

        .delete-button {
            border: none;

            padding: 3px 6px;

            border-radius: 6px;

            background:
                rgba(
                    168,
                    93,
                    120,
                    0.12
                );

            color:
                var(--pink-dark);

            font-family:
                "DM Sans",
                sans-serif;

            font-size: 10px;

            cursor: pointer;

            transition:
                0.2s ease;
        }

        .delete-button:hover {
            background:
                var(--pink-dark);

            color: white;
        }

        .empty-message {
            grid-column:
                1 / -1;

            text-align: center;

            padding: 60px 20px;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 26px;

            color:
                var(--purple-dark);
        }

        .loading {
            grid-column:
                1 / -1;

            text-align: center;

            padding: 50px;

            color:
                var(--purple-dark);
        }

        .error {
            grid-column:
                1 / -1;

            text-align: center;

            padding: 40px 20px;

            color:
                var(--pink-dark);
        }


        /* TABLET */

        @media (max-width: 900px) {

            .gallery-grid {
                grid-template-columns:
                    repeat(3, 1fr);
            }

        }


        /* PHONE */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .gallery-card {
                padding:
                    40px 18px;

                border-radius: 26px;
            }

            .script-title {
                font-size: 43px;
            }

            h1 {
                font-size: 48px;
            }

            .description {
                font-size: 15px;

                margin-bottom: 30px;
            }

            .gallery-grid {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 12px;
            }

            .gallery-item {
                border-radius: 15px;
            }

            .photo-info {
                left: 7px;

                bottom: 7px;

                padding: 4px 6px;
            }

            .nickname {
                font-size: 10px;
            }

            .delete-button {
                font-size: 9px;

                padding: 3px 5px;
            }

        }

    </style>

</head>


<body>

    <main class="gallery-page">

        <section class="gallery-card">

            <p class="script-title">
                Russien @18
            </p>

            <h1>
                Celebration Gallery
            </h1>

            <p class="description">
                A collection of beautiful moments shared by
                everyone who celebrated this special day.
            </p>


            <div
                id="gallery"
                class="gallery-grid"
            >

                <div class="loading">
                    Loading memories...
                </div>

            </div>

        </section>

    </main>


    <script>

        const SUPABASE_URL =
            "https://magaomtlctseieufgijk.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_nIm23K5lShcFGJ6m18DzaA_EAXQXGc0";


        const BUCKET_NAME =
            "photos";


        const accessToken =
            sessionStorage.getItem(
                "russienAccessToken"
            );


        const gallery =
            document.getElementById(
                "gallery"
            );


        /*
         * User must be logged in.
         */

        if (!accessToken) {

            window.location.href =
                "nickname.html";

        }


        /* =========================================
           GET CURRENT USER
        ========================================= */

        async function getCurrentUser() {

            const response =
                await fetch(
                    `${SUPABASE_URL}/auth/v1/user`,
                    {
                        method: "GET",

                        headers: {
                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                `Bearer ${accessToken}`
                        }
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Your session has expired."
                );

            }


            return await response.json();

        }


        /* =========================================
           LOAD GALLERY
        ========================================= */

        async function loadGallery() {

            try {

                const user =
                    await getCurrentUser();


                const response =
                    await fetch(
                        `${SUPABASE_URL}/rest/v1/photos?select=id,nickname,photo_url,created_at,user_id&order=created_at.desc`,
                        {
                            method: "GET",

                            headers: {
                                "apikey":
                                    SUPABASE_KEY,

                                "Authorization":
                                    `Bearer ${accessToken}`
                            }
                        }
                    );


                if (!response.ok) {

                    const error =
                        await response.text();

                    throw new Error(
                        error
                    );

                }


                const photos =
                    await response.json();


                gallery.innerHTML =
                    "";


                if (photos.length === 0) {

                    gallery.innerHTML = `
                        <div class="empty-message">
                            No memories have been shared yet.
                        </div>
                    `;

                    return;

                }


                photos.forEach(photo => {

                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "gallery-item";


                    const image =
                        document.createElement(
                            "img"
                        );


                    image.src =
                        photo.photo_url;


                    image.alt =
                        `Photo shared by ${photo.nickname}`;


                    image.loading =
                        "lazy";


                    const photoInfo =
                        document.createElement(
                            "div"
                        );


                    photoInfo.className =
                        "photo-info";


                    const nicknameElement =
                        document.createElement(
                            "p"
                        );


                    nicknameElement.className =
                        "nickname";


                    nicknameElement.textContent =
                        photo.nickname;


                    photoInfo.appendChild(
                        nicknameElement
                    );


                    /*
                     * DELETE BUTTON
                     *
                     * Only show it when
                     * this photo belongs
                     * to the logged-in user.
                     */

                    if (
                        photo.user_id ===
                        user.id
                    ) {

                        const deleteButton =
                            document.createElement(
                                "button"
                            );


                        deleteButton.className =
                            "delete-button";


                        deleteButton.textContent =
                            "Delete";


                        deleteButton.type =
                            "button";


                        deleteButton.addEventListener(
                            "click",
                            () => {

                                deletePhoto(
                                    photo,
                                    item
                                );

                            }
                        );


                        photoInfo.appendChild(
                            deleteButton
                        );

                    }


                    item.appendChild(
                        image
                    );


                    item.appendChild(
                        photoInfo
                    );


                    gallery.appendChild(
                        item
                    );

                });


            } catch (error) {

                console.error(
                    "GALLERY ERROR:",
                    error
                );


                gallery.innerHTML = `

                    <div class="error">

                        Unable to load the gallery.

                    </div>

                `;

            }

        }


        /* =========================================
           DELETE PHOTO
        ========================================= */

        async function deletePhoto(
            photo,
            galleryItem
        ) {

            const confirmed =
                confirm(
                    "Delete this photo?"
                );


            if (!confirmed) {

                return;

            }


            try {

                /*
                 * Get the Storage path
                 * from the public URL.
                 */

                const publicPrefix =
                    `${SUPABASE_URL}/storage/v1/object/public/${BUCKET_NAME}/`;


                const filePath =
                    decodeURIComponent(
                        photo.photo_url
                            .replace(
                                publicPrefix,
                                ""
                            )
                    );


                /*
                 * Delete the actual
                 * image from Storage.
                 */

                const storageResponse =
                    await fetch(
                        `${SUPABASE_URL}/storage/v1/object/${BUCKET_NAME}/${filePath}`,
                        {
                            method: "DELETE",

                            headers: {
                                "apikey":
                                    SUPABASE_KEY,

                                "Authorization":
                                    `Bearer ${accessToken}`
                            }
                        }
                    );


                if (!storageResponse.ok) {

                    const error =
                        await storageResponse.text();

                    throw new Error(
                        error
                    );

                }


                /*
                 * Delete the database record.
                 *
                 * RLS makes sure the user
                 * can only delete their
                 * own record.
                 */

                const databaseResponse =
                    await fetch(
                        `${SUPABASE_URL}/rest/v1/photos?id=eq.${photo.id}`,
                        {
                            method: "DELETE",

                            headers: {
                                "apikey":
                                    SUPABASE_KEY,

                                "Authorization":
                                    `Bearer ${accessToken}`
                            }
                        }
                    );


                if (!databaseResponse.ok) {

                    const error =
                        await databaseResponse.text();

                    throw new Error(
                        error
                    );

                }


                /*
                 * Remove the photo
                 * immediately from the page.
                 */

                galleryItem.remove();


            } catch (error) {

                console.error(
                    "DELETE ERROR:",
                    error
                );


                alert(
                    "Unable to delete this photo. Please try again."
                );

            }

        }


        loadGallery();

    </script>

</body>

</html>
