<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#fbe8ef"
    >

    <title>Russien @18 | Gallery</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500&family=Great+Vibes&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --pink-light: #fbe8ef;
            --pink: #e9a9bd;
            --pink-dark: #a85d78;

            --purple-light: #eee5f3;
            --purple: #b59ac5;
            --purple-dark: #76566f;

            --pearl: #fffdfb;
            --cream: #fff8f8;
            --text: #553f4c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: "DM Sans", sans-serif;

            color: var(--text);

            background:
                linear-gradient(
                    135deg,
                    var(--pink-light),
                    var(--purple-light),
                    var(--cream)
                );

            padding: 30px 18px;
        }

        .gallery-page {
            width: 100%;
            max-width: 1200px;
            margin: auto;
        }

        .gallery-card {
            background: rgba(255, 253, 251, 0.94);

            border-radius: 32px;

            padding: 55px 30px;

            box-shadow:
                0 20px 60px rgba(118, 86, 111, 0.15);
        }

        .script-title {
            margin: 0;

            text-align: center;

            font-family: "Great Vibes", cursive;

            font-size: 52px;

            color: var(--pink-dark);
        }

        h1 {
            margin: 12px 0 10px;

            text-align: center;

            font-family: "Cormorant Garamond", serif;

            font-size: clamp(42px, 7vw, 70px);

            font-weight: 500;

            color: var(--purple-dark);
        }

        .description {
            max-width: 650px;

            margin: 0 auto 45px;

            text-align: center;

            font-size: 17px;

            line-height: 1.7;

            color: var(--text);
        }

        .gallery-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;
        }

        .gallery-item {
            overflow: hidden;

            border-radius: 20px;

            background: var(--purple-light);

            box-shadow:
                0 8px 25px rgba(118, 86, 111, 0.12);
        }

        .gallery-item img {
            display: block;

            width: 100%;

            aspect-ratio: 1 / 1;

            object-fit: cover;

            transition: transform 0.4s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.04);
        }

        .photo-info {
            padding: 12px 15px;

            text-align: center;

            background: var(--pearl);
        }

        .nickname {
            margin: 0;

            font-family: "Cormorant Garamond", serif;

            font-size: 20px;

            color: var(--purple-dark);
        }

        .empty-message {
            text-align: center;

            padding: 60px 20px;

            font-family: "Cormorant Garamond", serif;

            font-size: 26px;

            color: var(--purple-dark);
        }

        .loading {
            text-align: center;

            padding: 50px;

            color: var(--purple-dark);
        }

        .error {
            text-align: center;

            padding: 40px 20px;

            color: var(--pink-dark);
        }


        /* TABLET */

        @media (max-width: 900px) {

            .gallery-grid {
                grid-template-columns:
                    repeat(3, 1fr);
            }

        }


        /* PHONE */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .gallery-card {
                padding: 40px 18px;

                border-radius: 26px;
            }

            .script-title {
                font-size: 43px;
            }

            h1 {
                font-size: 48px;
            }

            .description {
                font-size: 15px;

                margin-bottom: 30px;
            }

            .gallery-grid {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 12px;
            }

            .gallery-item {
                border-radius: 15px;
            }

            .photo-info {
                padding: 8px;
            }

            .nickname {
                font-size: 17px;
            }

        }

    </style>

</head>


<body>

    <main class="gallery-page">

        <section class="gallery-card">

            <p class="script-title">
                Russien @18
            </p>

            <h1>
                Celebration Gallery
            </h1>

            <p class="description">
                A collection of beautiful moments shared by
                everyone who celebrated this special day.
            </p>


            <div
                id="gallery"
                class="gallery-grid"
            >

                <div class="loading">
                    Loading memories...
                </div>

            </div>

        </section>

    </main>


    <script>

        const SUPABASE_URL =
            "https://magaomtlctseieufgijk.supabase.co";


        const SUPABASE_KEY =
            "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";


        const gallery =
            document.getElementById("gallery");


        async function loadGallery() {

            try {

                const response =
                    await fetch(
                        `${SUPABASE_URL}/rest/v1/photos?select=nickname,photo_url,created_at&order=created_at.desc`,
                        {
                            method: "GET",

                            headers: {
                                "apikey":
                                    SUPABASE_KEY,

                                "Authorization":
                                    `Bearer ${SUPABASE_KEY}`
                            }
                        }
                    );


                if (!response.ok) {

                    const error =
                        await response.text();

                    throw new Error(error);

                }


                const photos =
                    await response.json();


                gallery.innerHTML = "";


                if (photos.length === 0) {

                    gallery.innerHTML = `
                        <div class="empty-message">
                            No memories have been shared yet.
                        </div>
                    `;

                    return;

                }


                photos.forEach(photo => {

                    const item =
                        document.createElement("div");

                    item.className =
                        "gallery-item";


                    item.innerHTML = `

                        <img
                            src="${photo.photo_url}"
                            alt="Photo shared by ${photo.nickname}"
                            loading="lazy"
                        >

                        <div class="photo-info">

                            <p class="nickname">
                                ${photo.nickname}
                            </p>

                        </div>

                    `;


                    gallery.appendChild(item);

                });


            } catch (error) {

                console.error(error);


                gallery.innerHTML = `

                    <div class="error">

                        Unable to load the gallery.

                    </div>

                `;

            }

        }


        loadGallery();

    </script>

</body>

</html>
