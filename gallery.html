<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#f8dce8"
    >

    <title>Russien @18 — Memories</title>


    <!-- GOOGLE FONTS -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Great+Vibes&display=swap"
        rel="stylesheet"
    >


    <style>

        :root {

            --pink-light: #fbe8ef;
            --pink: #e9a9bd;
            --pink-dark: #a85d78;

            --purple-light: #eee5f3;
            --purple: #b59ac5;
            --purple-dark: #76566f;

            --pearl: #fffdfb;
            --cream: #fff8f8;
            --text: #553f4c;

        }


        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }


        body {

            min-height: 100vh;

            background:

                radial-gradient(
                    circle at top left,
                    var(--purple-light),
                    transparent 35%
                ),

                radial-gradient(
                    circle at bottom right,
                    var(--pink-light),
                    transparent 40%
                ),

                var(--cream);

            color: var(--text);

            font-family:
                "DM Sans",
                sans-serif;

            padding:
                45px 25px;

        }


        .page {

            max-width:
                1200px;

            margin:
                0 auto;

        }


        .header {

            text-align:
                center;

            margin-bottom:
                40px;

        }


        .small-title {

            font-size:
                12px;

            letter-spacing:
                4px;

            color:
                var(--purple-dark);

            margin-bottom:
                8px;

        }


        .title {

            font-family:
                "Great Vibes",
                cursive;

            font-size:
                55px;

            line-height:
                1;

            color:
                var(--pink-dark);

            margin-bottom:
                12px;

        }


        .subtitle {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                22px;

            color:
                var(--text);

        }


        .top-actions {

            display:
                flex;

            justify-content:
                center;

            gap:
                10px;

            margin-top:
                22px;

            flex-wrap:
                wrap;

        }


        .action-button {

            border:
                none;

            border-radius:
                12px;

            padding:
                11px 18px;

            font-family:
                "DM Sans",
                sans-serif;

            font-size:
                13px;

            font-weight:
                600;

            cursor:
                pointer;

            transition:
                0.25s ease;

        }


        .upload-button {

            background:
                linear-gradient(
                    135deg,
                    var(--pink),
                    var(--purple)
                );

            color:
                white;

            box-shadow:
                0 6px 18px
                rgba(
                    168,
                    93,
                    120,
                    0.16
                );

        }


        .logout-button {

            background:
                var(--purple-light);

            color:
                var(--purple-dark);

        }


        .action-button:hover {

            transform:
                translateY(-1px);

        }


        .gallery {

            display:
                grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        230px,
                        1fr
                    )
                );

            gap:
                20px;

        }


        .gallery-item {

            position:
                relative;

            overflow:
                hidden;

            border-radius:
                20px;

            background:
                var(--purple-light);

            box-shadow:
                0 8px 25px
                rgba(
                    118,
                    86,
                    111,
                    0.12
                );

            min-height:
                220px;

        }


        .gallery-item img {

            display:
                block;

            width:
                100%;

            height:
                300px;

            object-fit:
                cover;

            transition:
                transform
                0.4s ease;

        }


        .gallery-item:hover img {

            transform:
                scale(1.03);

        }


        .photo-info {

            position:
                absolute;

            left:
                10px;

            bottom:
                10px;

            padding:
                4px 9px;

            background:
                rgba(
                    255,
                    253,
                    251,
                    0.82
                );

            border-radius:
                8px;

            backdrop-filter:
                blur(5px);

        }


        .nickname {

            margin:
                0;

            font-family:
                "DM Sans",
                sans-serif;

            font-size:
                12px;

            font-weight:
                500;

            color:
                var(--text);

        }


        .delete-button {

            position:
                absolute;

            top:
                10px;

            right:
                10px;

            border:
                none;

            border-radius:
                8px;

            padding:
                7px 10px;

            background:
                rgba(
                    255,
                    253,
                    251,
                    0.88
                );

            color:
                var(--pink-dark);

            font-family:
                "DM Sans",
                sans-serif;

            font-size:
                11px;

            font-weight:
                600;

            cursor:
                pointer;

            backdrop-filter:
                blur(5px);

        }


        .delete-button:hover {

            background:
                white;

        }


        .empty-message,
        .error {

            grid-column:
                1 / -1;

            text-align:
                center;

            padding:
                60px 20px;

            color:
                var(--purple-dark);

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                22px;

        }


        .loading {

            grid-column:
                1 / -1;

            text-align:
                center;

            padding:
                60px 20px;

            color:
                var(--purple-dark);

            font-family:
                "Cormorant Garamond",
                serif;

            font-size:
                22px;

        }


        @media (max-width: 600px) {

            body {

                padding:
                    30px 15px;

            }


            .title {

                font-size:
                    45px;

            }


            .subtitle {

                font-size:
                    20px;

            }


            .gallery {

                grid-template-columns:
                    repeat(
                        2,
                        minmax(
                            0,
                            1fr
                        )
                    );

                gap:
                    12px;

            }


            .gallery-item {

                border-radius:
                    15px;

            }


            .gallery-item img {

                height:
                    220px;

            }


            .photo-info {

                left:
                    7px;

                bottom:
                    7px;

                padding:
                    4px 7px;

            }


            .nickname {

                font-size:
                    10px;

            }

        }


        @media (max-width: 380px) {

            .gallery {

                grid-template-columns:
                    1fr;

            }

        }

    </style>

</head>


<body>


    <main class="page">


        <header class="header">

            <p class="small-title">
                RUSSIEN @18
            </p>

            <h1 class="title">
                Our Memories
            </h1>

            <p class="subtitle">
                A collection of moments from the celebration
            </p>


            <div class="top-actions">

                <button
                    class="action-button upload-button"
                    id="uploadButton"
                >
                    + Add Photos
                </button>

                <button
                    class="action-button logout-button"
                    id="logoutButton"
                >
                    Log Out
                </button>

            </div>

        </header>


        <section
            class="gallery"
            id="gallery"
        >

            <div class="loading">
                Loading memories...
            </div>

        </section>


    </main>


    <script>

        const SUPABASE_URL =
            "https://magaomtlctseieufgijk.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_nIm23K5lShcFGJ6m18DzaA_EAXQXGc0";

        const BUCKET_NAME =
            "photos";


        const gallery =
            document.getElementById("gallery");

        const uploadButton =
            document.getElementById("uploadButton");

        const logoutButton =
            document.getElementById("logoutButton");


        const nickname =
            sessionStorage.getItem(
                "russienNickname"
            );

        const accessToken =
            sessionStorage.getItem(
                "russienAccessToken"
            );


        /*
        =========================================
        CHECK LOGIN
        =========================================
        */

        if (!nickname || !accessToken) {

            window.location.href =
                "nickname.html";

        }


        /*
        =========================================
        ADD PHOTOS
        =========================================
        */

        uploadButton.addEventListener(
            "click",
            () => {

                window.location.href =
                    "upload.html";

            }
        );


        /*
        =========================================
        LOG OUT
        =========================================
        */

        logoutButton.addEventListener(
            "click",
            () => {

                sessionStorage.removeItem(
                    "russienNickname"
                );

                sessionStorage.removeItem(
                    "russienAccessToken"
                );

                sessionStorage.removeItem(
                    "russienRefreshToken"
                );


                window.location.href =
                    "nickname.html";

            }
        );


        /*
        =========================================
        LOAD CURRENT USER
        =========================================
        */

        async function getCurrentUser() {

            const response =
                await fetch(
                    `${SUPABASE_URL}/auth/v1/user`,
                    {
                        method: "GET",

                        headers: {
                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                `Bearer ${accessToken}`
                        }
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Your login session has expired."
                );

            }


            return await response.json();

        }


        /*
        =========================================
        DELETE PHOTO
        =========================================
        */

        async function deletePhoto(
            photo,
            item,
            user
        ) {

            if (
                photo.user_id !==
                user.id
            ) {

                alert(
                    "You can only delete your own photos."
                );

                return;

            }


            const confirmed =
                confirm(
                    "Delete this photo?"
                );


            if (!confirmed) {

                return;

            }


            try {

                /*
                Get storage path from URL
                */

                const marker =
                    `/object/public/${BUCKET_NAME}/`;


                const markerIndex =
                    photo.photo_url.indexOf(
                        marker
                    );


                if (
                    markerIndex === -1
                ) {

                    throw new Error(
                        "Unable to find the photo file."
                    );

                }


                const filePath =
                    decodeURIComponent(
                        photo.photo_url.substring(
                            markerIndex +
                            marker.length
                        )
                    );


                /*
                Delete file from Storage
                */

                const storageResponse =
                    await fetch(
                        `${SUPABASE_URL}/storage/v1/object/${BUCKET_NAME}`,
                        {
                            method: "DELETE",

                            headers: {
                                "apikey":
                                    SUPABASE_KEY,

                                "Authorization":
                                    `Bearer ${accessToken}`,

                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                prefixes: [
                                    filePath
                                ]
                            })
                        }
                    );


                if (!storageResponse.ok) {

                    const errorText =
                        await storageResponse.text();

                    throw new Error(
                        errorText
                    );

                }


                /*
                Delete database record
                */

                const databaseResponse =
                    await fetch(
                        `${SUPABASE_URL}/rest/v1/photos?id=eq.${photo.id}`,
                        {
                            method: "DELETE",

                            headers: {
                                "apikey":
                                    SUPABASE_KEY,

                                "Authorization":
                                    `Bearer ${accessToken}`
                            }
                        }
                    );


                if (!databaseResponse.ok) {

                    const errorText =
                        await databaseResponse.text();

                    throw new Error(
                        errorText
                    );

                }


                item.remove();


                if (
                    gallery.children.length === 0
                ) {

                    gallery.innerHTML = `
                        <div class="empty-message">
                            No memories have been shared yet.
                        </div>
                    `;

                }

            } catch (error) {

                console.error(
                    "DELETE ERROR:",
                    error
                );


                alert(
                    "Unable to delete photo: " +
                    error.message
                );

            }

        }


        /*
        =========================================
        LOAD GALLERY
        =========================================
        */

        async function loadGallery() {

            try {

                const user =
                    await getCurrentUser();


                const response =
                    await fetch(
                        `${SUPABASE_URL}/rest/v1/photos?select=id,nickname,photo_url,created_at,user_id&order=created_at.desc`,
                        {
                            method: "GET",

                            headers: {
                                "apikey":
                                    SUPABASE_KEY,

                                "Authorization":
                                    `Bearer ${accessToken}`
                            }
                        }
                    );


                if (!response.ok) {

                    const error =
                        await response.text();

                    throw new Error(
                        error
                    );

                }


                const photos =
                    await response.json();


                gallery.innerHTML =
                    "";


                if (
                    photos.length === 0
                ) {

                    gallery.innerHTML = `
                        <div class="empty-message">
                            No memories have been shared yet.
                        </div>
                    `;

                    return;

                }


                photos.forEach(
                    photo => {

                        const item =
                            document.createElement(
                                "div"
                            );


                        item.className =
                            "gallery-item";


                        const image =
                            document.createElement(
                                "img"
                            );


                        image.src =
                            photo.photo_url;

                        image.alt =
                            `Photo shared by ${photo.nickname}`;

                        image.loading =
                            "lazy";


                        item.appendChild(
                            image
                        );


                        /*
                        Delete button only appears
                        for the current user's photos.
                        */

                        if (
                            photo.user_id ===
                            user.id
                        ) {

                            const deleteButton =
                                document.createElement(
                                    "button"
                                );


                            deleteButton.className =
                                "delete-button";


                            deleteButton.textContent =
                                "Delete";


                            deleteButton.addEventListener(
                                "click",
                                () => {

                                    deletePhoto(
                                        photo,
                                        item,
                                        user
                                    );

                                }
                            );


                            item.appendChild(
                                deleteButton
                            );

                        }


                        const photoInfo =
                            document.createElement(
                                "div"
                            );


                        photoInfo.className =
                            "photo-info";


                        const name =
                            document.createElement(
                                "p"
                            );


                        name.className =
                            "nickname";


                        name.textContent =
                            photo.nickname;


                        photoInfo.appendChild(
                            name
                        );


                        item.appendChild(
                            photoInfo
                        );


                        gallery.appendChild(
                            item
                        );

                    }
                );


            } catch (error) {

                console.error(
                    "GALLERY ERROR:",
                    error
                );


                gallery.innerHTML = `
                    <div class="error">
                        Unable to load the gallery.
                        <br>
                        <small>
                            ${error.message}
                        </small>
                    </div>
                `;

            }

        }


        loadGallery();

    </script>

</body>

</html>
